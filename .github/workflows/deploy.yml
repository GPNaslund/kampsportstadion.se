name: Deploy to one.com

on:
  push:
    branches: [prod]
  workflow_dispatch: {}

# Never run two deploys at once; a newer push cancels an in-flight one.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # next.config.js sets output:'export', so this writes the static site to ./out
      - run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      # Mirror ./out onto the server over SFTP. --delete makes the remote an
      # exact copy of the build (removing orphaned old files, first run
      # included); .htaccess ships inside ./out so it is always re-uploaded.
      # cmd:fail-exit makes the job fail if any transfer errors.
      - name: Deploy ./out to one.com over SFTP
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp "sftp://${SFTP_HOST}" <<SCRIPT
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          user "${SFTP_USER}" "${SFTP_PASS}"
          mirror --reverse --delete --verbose ./out "${SFTP_DIR}"
          bye
          SCRIPT

      # No post-deploy HTTP smoke check: one.com's abuse protection blocks the
      # GitHub runner's datacenter IP after the SFTP session, so curl from the
      # runner times out (false failure) even when the site is fine. Verify the
      # deploy from a normal network instead.
